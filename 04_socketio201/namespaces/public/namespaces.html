<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    .container{
        margin-top: 30px;
    }
    input{
        height: 35px;
        width: 100%;
    }
    #messages{
        list-style-type: none;
        margin: 0;
        padding: 0;
    }
    #messages li{
        padding: 5px 10px;
    }
    #message li:nth-child(odd){
        background: #aaa;
    }
</style>

<div class="container text-center">
    <form class="row" id="message-form">
        <div class="col-6">
            <input id="user-message" type="text" placeholder="Enter your message" />
        </div>
        <div class="col-2">
            <input class="btn btn-primary" type="submit" value="Send!" />
        </div>
    </form>

    <ul id="messages">
        <!-- THIS WILL BE POPULATED BY JAVASCRIPT! -->
    </ul>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>
    // using multiplexing with tcp connection: go to the same server on 2 different namespaces with own event handlers
    // all namespaces are managed by the server, the client can only ask to access a specific ns, create a ns variable and use it where appropriately
    const socket = io("http://localhost:8001");
    const adminSocket = io("http://localhost:8001/admin");

    socket.on('connect', () => {
        // do connect type stuff
    });

    socket.on('messageFromServer', (dataFromServer) => {
        console.log(dataFromServer);
    });

    socket.on('newMessageToClients', (newMessage) => {
        document.querySelector('#messages').innerHTML += `<li>${newMessage.text}</li>`;
    });

    document.querySelector('#message-form').addEventListener('submit', (event) => {
        event.preventDefault(); //otherwise the brouser will try & refresh
        const newMessage = document.querySelector('#user-message').value
        // console.log(newMessage);        
        socket.emit('newMessageToServer', {text: newMessage});
    });
    
</script>
